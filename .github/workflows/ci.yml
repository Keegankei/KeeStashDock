name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish smoke check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore KeeStashDock.sln

      - name: Build Release
        run: dotnet build KeeStashDock.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution KeeStashDock.sln --configuration Release --no-build

      - name: Restore Windows publish assets
        run: dotnet restore src/KeeStashDock.Desktop/KeeStashDock.Desktop.csproj --runtime win-x64

      - name: Publish smoke check
        run: >-
          dotnet publish src/KeeStashDock.Desktop/KeeStashDock.Desktop.csproj
          --configuration Release
          --no-restore
          -p:PublishProfile=FolderProfile
          --output artifacts/publish
