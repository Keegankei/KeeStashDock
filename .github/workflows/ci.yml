name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish smoke check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Python for offline helper tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test offline helper safety
        run: python -B tools/offline-translation/test_runtime.py

      - name: Test offline process identity
        shell: pwsh
        run: ./tools/offline-translation/test_process.ps1

      - name: Test native runtime setup decisions
        shell: pwsh
        run: ./tools/native-runtime/test_setup.ps1

      - name: Test cleanup safety
        shell: pwsh
        run: ./tools/Test-Clean.ps1

      - name: Test release privacy checks
        shell: pwsh
        run: ./tools/Test-PublishSafety.ps1

      - name: Install verified local OCR models
        shell: pwsh
        run: ./tools/ocr/Setup.ps1

      - name: Restore solution
        run: dotnet restore KeeStashDock.sln

      - name: Build Release
        run: dotnet build KeeStashDock.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution KeeStashDock.sln --configuration Release --no-build

      - name: Restore Windows publish assets
        run: dotnet restore src/KeeStashDock.Desktop/KeeStashDock.Desktop.csproj --runtime win-x64

      - name: Publish smoke check
        run: >-
          dotnet publish src/KeeStashDock.Desktop/KeeStashDock.Desktop.csproj
          --configuration Release
          --no-restore
          -p:PublishProfile=FolderProfile
          --output artifacts/publish

      - name: Verify portable package
        shell: pwsh
        run: ./tools/Verify-Publish.ps1 -Path artifacts/publish
