<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img" aria-label="license: Apache-2.0">
  <title>license: Apache-2.0</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
    <stop offset="1" stop-opacity=".12"/>
  </linearGradient>
  <clipPath id="r"><rect width="140" height="20" rx="3"/></clipPath>
  <g clip-path="url(#r)">
